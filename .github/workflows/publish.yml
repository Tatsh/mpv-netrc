concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref }}'
  queue: 'max'
jobs:
  check:
    name: 'Wait for Workflows'
    permissions:
      actions: 'read'
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - env:
          COMMIT_SHA: '${{ github.sha }}'
          GH_TOKEN: '${{ github.token }}'
        id: 'check'
        name: 'Wait for workflows'
        run: |
          sha="$COMMIT_SHA"
          required_workflows=()
          optional_workflows=('Prettier' 'QA' 'Spelling' 'markdownlint')
          process_workflow() {
            local workflow="$1" treat_missing="$2"
            local run status conclusion
            run=$(gh run list --workflow "$workflow" --commit "$sha" --json status,conclusion --jq '.[0]') || run=''
            if [[ -z "$run" || "$run" == 'null' ]]; then
              if [[ "$treat_missing" == 'pending' ]]; then
                echo "Required workflow '$workflow' has not registered a run yet; waiting."
                return 2
              fi
              echo "Optional workflow '$workflow' did not run for this commit; skipping."
              return 0
            fi
            status=$(echo "$run" | jq -r '.status') || status=''
            conclusion=$(echo "$run" | jq -r '.conclusion') || conclusion=''
            case "$conclusion" in
              failure|cancelled|timed_out|startup_failure|action_required)
                echo "::error::Workflow '$workflow' ${conclusion}."
                return 1
                ;;
              success|skipped|neutral)
                return 0
                ;;
              *)
                if [[ "$status" == 'completed' ]]; then
                  echo "::error::Workflow '$workflow' completed with unexpected conclusion '${conclusion}'."
                  return 1
                fi
                echo "Workflow '$workflow' still pending (status=${status})."
                return 2
                ;;
            esac
          }
          for i in $(seq 1 30); do
            all_done=true
            for workflow in "${required_workflows[@]}"; do
              rc=0
              process_workflow "$workflow" pending || rc=$?
              [[ $rc -eq 1 ]] && exit 1
              [[ $rc -eq 2 ]] && all_done=false
            done
            for workflow in "${optional_workflows[@]}"; do
              rc=0
              process_workflow "$workflow" skip || rc=$?
              [[ $rc -eq 1 ]] && exit 1
              [[ $rc -eq 2 ]] && all_done=false
            done
            if [[ "$all_done" == 'true' ]]; then
              echo 'All required workflows succeeded.'
              exit 0
            fi
            echo "Waiting 60s for workflows to complete (attempt ${i}/30)..."
            sleep 60
          done
          echo '::error::Timed out waiting for workflows.'
          exit 1
  publish:
    environment: 'release'
    name: 'Publish'
    needs:
      - 'check'
    permissions:
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - uses: 'leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377'
        with:
          luaVersion: '5.1'
      - uses: 'leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389'
      - env:
          LUAROCKS_API_KEY: '${{ secrets.LUAROCKS_API_KEY }}'
        id: 'check_secret'
        name: 'Check LUAROCKS_API_KEY is set'
        run: |
          if [[ -n "$LUAROCKS_API_KEY" ]]; then
            echo 'has_luarocks_api_key=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_luarocks_api_key=false' >> "$GITHUB_OUTPUT"
            echo '::warning::LUAROCKS_API_KEY secret is empty; the upload step will be skipped.'
          fi
      - env:
          LUAROCKS_API_KEY: '${{ secrets.LUAROCKS_API_KEY }}'
        if: "steps.check_secret.outputs.has_luarocks_api_key == 'true'"
        name: 'Upload package'
        run: 'luarocks upload --api-key="$LUAROCKS_API_KEY" ./*.rockspec'
  release-assets:
    concurrency:
      group: 'release-assets-${{ github.ref }}'
      queue: 'max'
    if: "github.ref_type == 'tag'"
    name: 'Release Assets'
    needs:
      - 'publish'
    permissions:
      contents: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - env:
          GH_REPO: '${{ github.repository }}'
          GH_TOKEN: '${{ github.token }}'
        name: 'Create or update draft release'
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --notes ''
          shopt -s nullglob
          assets=(_release_assets/*)
          if [ -z "${assets[0]-}" ]; then
            echo 'No build artifacts to attach.'
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
        shell: 'bash'
name: 'Publish'
'on':
  push:
    tags:
      - 'v*'
permissions: {}
